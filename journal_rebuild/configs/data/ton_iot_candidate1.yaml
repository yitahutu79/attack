{
  "dataset_name": "ton_iot_candidate1",
  "data_dir": "dataset/TON_IoT/Processed_datasets/Processed_Network_dataset",
  "split_ranges": {
    "model_train_benign": [1554198358, 1554364211],
    "reference_benign": [1556423460, 1556423585],
    "independent_calibration_benign": [1556423589, 1556423842],
    "test": [1556485532, 1556549156]
  },
  "window_size": 128,
  "stride": 16,
  "anomaly_ratio": 0.15,
  "scaler": "minmax",
  "clip_minmax": true,
  "drop_missing_ratio_threshold": 0.995,
  "drop_contaminated_benign_rows": true,
  "categorical_cols": ["proto", "service", "conn_state"],
  "numeric_candidate_cols": [
    "duration",
    "src_bytes",
    "dst_bytes",
    "missed_bytes",
    "src_pkts",
    "src_ip_bytes",
    "dst_pkts",
    "dst_ip_bytes",
    "dns_qclass",
    "dns_qtype",
    "dns_rcode",
    "http_request_body_len",
    "http_response_body_len",
    "http_status_code"
  ],
  "excluded_text_cols": [
    "dns_query",
    "dns_AA",
    "dns_RD",
    "dns_RA",
    "dns_rejected",
    "ssl_version",
    "ssl_cipher",
    "ssl_resumed",
    "ssl_established",
    "ssl_subject",
    "ssl_issuer",
    "http_trans_depth",
    "http_method",
    "http_uri",
    "http_referrer",
    "http_version",
    "http_user_agent",
    "http_orig_mime_types",
    "http_resp_mime_types",
    "weird_name",
    "weird_addl",
    "weird_notice"
  ],
  "forbidden_model_cols": ["label", "type", "ts", "src_ip", "dst_ip", "src_port", "dst_port"],
  "manifest_path": "journal_rebuild/data/ton_iot_candidate1/manifests/canonical_split_manifest.csv",
  "window_manifest_path": "journal_rebuild/data/ton_iot_candidate1/manifests/window_manifest.csv",
  "data_manifest_path": "journal_rebuild/data/ton_iot_candidate1/manifests/data_manifest.json",
  "processed_dir": "journal_rebuild/data/ton_iot_candidate1/processed",
  "scaler_path": "journal_rebuild/data/ton_iot_candidate1/processed/scaler.pkl"
}
